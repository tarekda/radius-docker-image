authorize_reply_query = "SELECT 'Mikrotik-Rate-Limit', CONCAT(speed_down, 'k/', speed_up, 'k'), ':=' \
                            FROM radprofile p \
                            JOIN raduserprofile up ON p.id = up.profile_id \
                            WHERE up.username = '%{SQL-User-Name}'"

