#
# MySQL accounting queries for FreeRADIUS 3.x.
#
# rlm_sql 3.x resolves accounting queries via `accounting.reference`.
# Keeping only legacy top-level accounting_*_query names can make the module
# resolve to ".query" / noop or fail under accounting load.
#

accounting {
    reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

    type {
        start {
            query = "INSERT INTO radacct ( \
  acctsessionid, acctuniqueid, username, realm, nasipaddress, nasportid, nasporttype, \
  acctstarttime, acctupdatetime, acctstoptime, acctinterval, acctsessiontime, \
  acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, \
  calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol, framedipaddress, \
  framedipv6address, framedipv6prefix, framedinterfaceid, delegatedipv6prefix \
) VALUES ( \
  '%{Acct-Session-Id}', MD5(CONCAT('%{Acct-Session-Id}','|','%{User-Name}','|','%{NAS-IP-Address}')), '%{User-Name}', '%{Realm}', '%{NAS-IP-Address}', \
  '%{NAS-Port}', '%{NAS-Port-Type}', \
  NOW(), NOW(), NULL, \
  0, 0, \
  '%{Acct-Authentic}', '%{Connect-Info}', '', \
  %{%{Acct-Input-Octets}:-0}, %{%{Acct-Output-Octets}:-0}, \
  '%{Called-Station-Id}', '%{Calling-Station-Id}', '', \
  '%{Service-Type}', '%{Framed-Protocol}', '%{Framed-IP-Address}', \
  '%{Framed-IPv6-Address}', '%{Framed-IPv6-Prefix}', '%{Framed-Interface-Id}', '%{Delegated-IPv6-Prefix}' \
)"
        }

        interim-update {
            query = "UPDATE radacct SET \
  acctupdatetime = NOW(), \
  acctinterval = 0, \
  acctsessiontime = %{%{Acct-Session-Time}:-0}, \
  acctinputoctets = %{%{Acct-Input-Octets}:-0}, \
  acctoutputoctets = %{%{Acct-Output-Octets}:-0}, \
  calledstationid = '%{Called-Station-Id}', \
  callingstationid = '%{Calling-Station-Id}', \
  framedipaddress = '%{Framed-IP-Address}' \
WHERE acctsessionid = '%{Acct-Session-Id}' \
  AND username COLLATE utf8mb4_unicode_ci = '%{User-Name}' COLLATE utf8mb4_unicode_ci \
  AND nasipaddress = '%{NAS-IP-Address}' \
  AND acctstoptime IS NULL"
        }

        stop {
            query = "UPDATE radacct SET \
  acctstoptime = NOW(), \
  acctsessiontime = %{%{Acct-Session-Time}:-0}, \
  acctinputoctets = %{%{Acct-Input-Octets}:-0}, \
  acctoutputoctets = %{%{Acct-Output-Octets}:-0}, \
  acctterminatecause = '%{Acct-Terminate-Cause}', \
  connectinfo_stop = '%{Connect-Info}' \
WHERE acctsessionid = '%{Acct-Session-Id}' \
  AND username COLLATE utf8mb4_unicode_ci = '%{User-Name}' COLLATE utf8mb4_unicode_ci \
  AND nasipaddress = '%{NAS-IP-Address}' \
  AND acctstoptime IS NULL"
        }
    }
}
