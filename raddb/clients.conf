# Example NAS clients (commented). Real NAS entries come from MySQL via
# rlm_sql read_clients = yes. Never commit production shared secrets here.
#
# For production NAS definitions in the `nas` table, prefer
# require_message_authenticator = yes where the NAS supports it (Blast RADIUS).
# The loopback healthcheck client below must keep it disabled.

# client example-nas {
#     ipaddr = 192.0.2.10
#     secret = REPLACE_ME
#     nas_type = other
#     require_message_authenticator = yes
# }

# Container-internal client used by the Docker healthcheck (Status-Server probe).
# Only reachable from inside the container (loopback). Secret is exported by
# start.sh (HEALTHCHECK_SECRET, default radius-healthcheck).
client healthcheck {
    ipaddr = 127.0.0.1
    secret = $ENV{HEALTHCHECK_SECRET}
    nas_type = other
    require_message_authenticator = no
}
