name: CI

on:
  push:
    branches: [main, master, feat/*]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck -S warning start.sh raddb/scripts/*.sh

  docker-build:
    name: Docker image builds and validates config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build image
        run: |
          docker build \
            --build-arg IMAGE_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${{ github.sha }}" \
            -t radius-docker-image-freeradius:${{ steps.version.outputs.version }} \
            -t radius-docker-image-freeradius:ci \
            .
      - name: Validate image contents (smoke test)
        run: |
          docker run --rm --entrypoint bash radius-docker-image-freeradius:ci -c '
            set -e
            grep -q "max_connections = 128" /etc/freeradius/3.0/sites-available/default
            grep -q "max = 128" /etc/freeradius/3.0/mods-available/sql
            test -f /opt/freeradius/3.0/scripts/radius_metrics_exporter.py
            test -x /opt/freeradius/3.0/scripts/healthcheck.sh
            test -x /start.sh
            /usr/sbin/freeradius -v | grep -qi freeradius
            echo "Image smoke test OK"
          '
