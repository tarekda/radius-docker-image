# Walled-garden HTTP responder.
#
# RouterOS 7 dropped `redirect-to` from /ip proxy access, so nothing on the
# router can emit an HTTP 302 any more. Quarantined subscribers' port-80
# traffic is dst-nat'd here instead.
#
# Captive-portal probes MUST succeed for many CPE firmwares (TP-Link especially).
# Those routers run an "Internet detection" check on a timer (~15 min) and
# tear down PPPoE with User-Request when the check fails — which is exactly
# the flap we saw on xn32. Returning the platform-expected body keeps the
# WAN up; browsers that fetch any other URL still get bounced to the portal.
#
# Trade-off: phones will not auto-pop "Sign in to network". Subscribers still
# reach the pay page by opening any plain-HTTP site or the portal bookmark.

server {
    listen 80 default_server;
    server_name _;

    add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    # --- CPE / OS connectivity checks (must NOT 302) ---

    # Android / Chrome
    location = /generate_204 {
        return 204;
    }
    location = /gen_204 {
        return 204;
    }

    # Windows NCSI
    location = /connecttest.txt {
        default_type text/plain;
        return 200 "Microsoft Connect Test";
    }
    location = /ncsi.txt {
        default_type text/plain;
        return 200 "Microsoft NCSI";
    }

    # Apple + generic "Success" probes (incl. /success.txt?ipv4)
    location = /hotspot-detect.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }
    location = /library/test/success.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }
    location ^~ /success.txt {
        default_type text/plain;
        return 200 "Success";
    }
    location = /canonical.html {
        default_type text/html;
        return 200 "<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>";
    }

    # Local liveness probe
    location = /_healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else → payment portal
    location / {
        return 302 https://radius.xnetcloud.tech/subscriber;
    }
}
