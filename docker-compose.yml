version: '3'
services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: radius
      MYSQL_USER: radius
      MYSQL_PASSWORD: radiuspassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  freeradius:
    build: .
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      - mysql
    environment:
      SQL_SERVER: mysql
      SQL_USER: radius
      SQL_PASSWORD: radiuspassword

volumes:
  mysql-data: