services:
  freeradius:
    build: .
    environment:
      SQL_SERVER: 172.8.16.4  # MySQL server IP
      SQL_USER: radius
      SQL_PASSWORD: password
      SQL_PORT: 3306
      SQL_DATABASE: radius
      FREERADIUS_DEBUG: "0"
    volumes:
      - ./logs:/var/log/freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "1700:1700/udp"
    restart: unless-stopped

